name: Restore tested frontend
description: Restore the frontend artifact produced by this workflow run.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: komari-frontend
        path: ${{ runner.temp }}/frontend-artifact
    - name: Restore embedded frontend
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p web/public/defaultTheme
        tar -xzf "$RUNNER_TEMP/frontend-artifact/komari-frontend.tar.gz" -C web/public/defaultTheme
        test -s web/public/defaultTheme/dist.tar.zst

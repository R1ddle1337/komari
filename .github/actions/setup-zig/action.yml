name: Setup pinned Zig
description: Install the audited CGO cross-compiler with a mandatory SHA-256 check.

runs:
  using: composite
  steps:
    - name: Download and verify Zig 0.14.1
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/komari-zig-0.14.1.tar.xz"
        curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
          https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o "$archive"
        printf '%s  %s\n' 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c "$archive" | sha256sum --strict --check -
        tar -C "$RUNNER_TEMP" -Jxf "$archive"
        echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

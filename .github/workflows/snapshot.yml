name: Publish Owned Server Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-server-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'R1ddle1337/komari' && github.ref == 'refs/heads/owned'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: snapshot
